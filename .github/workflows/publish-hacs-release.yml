name: Publish HACS Release

# Release process:
# - DAYLIGHT_CALENDAR_CARD_VERSION must be committed in skylight-calendar-card.js before release.
# - Open a release-prep PR that bumps the version, merge it to protected main,
#   then run this manual workflow from main.
# - This workflow intentionally fails if the source still contains the version placeholder.
on:
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Copilot CLI
        id: install_copilot
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Read card version
        id: version
        run: |
          VERSION="$(grep -oE "DAYLIGHT_CALENDAR_CARD_VERSION = '[^']+'" skylight-calendar-card.js | sed -E "s/.*'([^']+)'.*/\1/")"

          echo "Detected version: $VERSION"

          if [ -z "$VERSION" ] || [ "$VERSION" = "dev" ] || echo "$VERSION" | grep -q "__"; then
            echo "ERROR: Invalid DAYLIGHT_CALENDAR_CARD_VERSION"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "ERROR: Version must look like v1.2.3 or v1.2.3-beta0"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "ERROR: Tag $VERSION already exists"
            exit 1
          fi

      - name: Generate GitHub release notes
        id: generated_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            -f target_commitish="main" \
            > generated-release-notes.json

          jq -r '.name' generated-release-notes.json > release-title.txt
          jq -r '.body' generated-release-notes.json > generated-release-notes.md

      - name: Prepare Daylight draft notes and Copilot prompt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m scripts.release_notes prepare \
            --tag "$VERSION" \
            --generated generated-release-notes.md \
            --notes RELEASE_NOTES.md \
            --prompt ai-release-prompt.md

      - name: Polish release notes with Copilot
        id: copilot_notes
        if: steps.install_copilot.outcome == 'success'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            -p "$(cat ai-release-prompt.md)" \
            -s \
            --no-ask-user \
            > RELEASE_NOTES.ai.md

          if [ ! -s RELEASE_NOTES.ai.md ]; then
            echo "Copilot returned an empty response"
            exit 1
          fi


      - name: Select and validate Daylight draft notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ steps.copilot_notes.outcome }}" = "success" ]; then
            python -m scripts.release_notes select \
              --tag "$VERSION" \
              --generated generated-release-notes.md \
              --notes RELEASE_NOTES.md \
              --candidate RELEASE_NOTES.ai.md
          else
            echo "Copilot unavailable; using Daylight-style GitHub-notes fallback."
          fi

          python -m scripts.release_notes validate \
            --tag "$VERSION" \
            --generated generated-release-notes.md \
            --notes RELEASE_NOTES.md

          {
            echo "### Draft Daylight Calendar Card release notes"
            echo "Copilot outcome: ${{ steps.copilot_notes.outcome }}"
            echo "Review the draft for factual accuracy before publishing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run release-note formatting regression tests
        run: python -m unittest discover -s tests -p 'test_release_notes.py' -v

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="$(cat release-title.txt)"

          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --target main \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            "${PRERELEASE_ARGS[@]}"
