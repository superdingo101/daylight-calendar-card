name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  node-tests:
    name: Node ${{ matrix.node-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Verify generated bundle is current
        run: npm run check:build

      - name: Run tests
        run: npm test
