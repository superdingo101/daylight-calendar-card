name: Tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate-pr570-bundle:
    if: github.event.pull_request.number == 570
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate bundle and restore workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          npm run build

          # Restore this temporary workflow from the commit immediately before
          # the temporary change, so the resulting tree contains only the
          # intended regenerated bundle change.
          git show HEAD^:.github/workflows/tests.yml > .github/workflows/tests.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skylight-calendar-card.js .github/workflows/tests.yml
          git commit -m "Regenerate development bundle"
          git push origin "HEAD:$HEAD_BRANCH"
