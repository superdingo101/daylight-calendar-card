name: Refresh PR 652 visual baselines

on:
  push:
    branches:
      - fix/import-header-alignment
    paths:
      - .github/workflows/refresh-pr-652-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/import-header-alignment
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playwright/visual.spec.js-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Update visual baselines for relocated header controls"
            git push origin HEAD:fix/import-header-alignment
          fi
