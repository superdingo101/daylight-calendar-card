name: Issue 612 reconstruction validation

on:
  push:
    branches:
      - fix/header-time-sensor-picker

permissions:
  contents: write

jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/header-time-sensor-picker
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --fund=false
      - name: Rebuild shipped artifact
        run: npm run build
      - name: Commit generated artifact to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skylight-calendar-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild shipped artifact for header clock configuration"
            git push origin HEAD:refs/heads/fix/header-time-sensor-picker
          fi
      - run: npm run check:build
      - name: Check JavaScript syntax
        run: |
          node --check src/editor/daylight-calendar-card-editor.js
          node --check src/utils/date-utils.js
          node --check src/skylight-calendar-card.js
          node --check skylight-calendar-card.js
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
